# A Bot API server of your own, which removes the 20 MB download limit and
# raises what you can send to 2000 MB. Optional: Chute talks to Telegram's own
# servers unless api_root says otherwise.
#
#   1. Get an api_id and api_hash from https://my.telegram.org (Chute's bot
#      token is not enough; the server needs an application of its own).
#   2. cp service/env.example service/.env, put your two values in it, then
#      chmod 600 service/.env. Compose reads it on its own, so the values
#      never go near your shell history. From this folder:
#        docker compose -f service/telegram-bot-api.yml up -d
#   3. ./chute logout          deregisters the bot from Telegram's servers.
#                              This bars it from them for 10 minutes, so do it
#                              once the container is already up.
#   4. Put this in config.json, then ./chute restart:
#        "api_root": "http://localhost:8081",
#        "security": { "max_file_mb": 2000 }
#
# The volume is a host folder rather than a named volume on purpose: Chute
# reads the files straight off disk, so it has to be somewhere it can see.

services:
  telegram-bot-api:
    image: ghcr.io/gramiojs/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - ~/.telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
